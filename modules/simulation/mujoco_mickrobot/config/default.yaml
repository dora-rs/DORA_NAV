physics:
  timestep_s: 0.002
  gravity_mps2: [0.0, 0.0, -9.80665]
  realtime_factor: 1.0

vehicle:
  wheel_separation_m: 0.70
  wheel_radius_m: 0.15
  cmd_timeout_s: 0.5
  max_linear_mps: 2.0
  max_angular_rad_s: 2.0
  max_wheel_rad_s: 20.0
  max_wheel_accel_rad_s2: 30.0
  actuator_force_limit_n: 100.0

lidar:
  enabled: true
  rate_hz: 10.0
  frame_id: lidar_link
  channels: 16
  horizontal_samples: 900
  vertical_min_rad: -0.30
  vertical_max_rad: 0.30
  min_range_m: 0.1
  max_range_m: 80.0
  range_noise_std_m: 0.01

camera:
  enabled: true
  rate_hz: 30.0
  frame_id: camera_link
  width: 640
  height: 480
  horizontal_fov_deg: 90.0

imu:
  enabled: true
  rate_hz: 100.0
  frame_id: imu_link
  acceleration_noise_std_g: 0.002
  gyro_noise_std_rad_s: 0.001
  acceleration_bias_g: [0.0, 0.0, 0.0]
  gyro_bias_rad_s: [0.0, 0.0, 0.0]
  bias_random_walk_std: 0.00001

odometry:
  enabled: true
  rate_hz: 50.0
  frame_id: odom
  child_frame_id: base_footprint
  wheel_scale_error_std: 0.001
  wheel_noise_std_rad_s: 0.002

gnss:
  enabled: true
  rate_hz: 10.0
  frame_id: gnss_link
  origin:
    latitude_deg: 39.9042
    longitude_deg: 116.4074
    altitude_m: 50.0
  position_noise_std_m: 0.5
  velocity_noise_std_mps: 0.05

runtime:
  headless: false
  fastest: false
  deterministic: false
  random_seed: 42
  output_failure_limit: 5
  statistics_interval_s: 5.0

rerun:
  spawn: true
  connect_url: ""
  rate_window_s: 2.0
  statistics_interval_s: 2.0
