nodes:
######################传感器驱动########################
  - id: rslidar_driver
    path: ../build/modules/drivers/rslidar_sdk/rslidar_dora_node
    outputs:
      - pointcloud
      - imu

  - id: livox_driver
    path: ../build/modules/drivers/livox_driver/livox_dora_driver
    outputs:
      - pointcloud
      - imu
#######################################################

######################定位算法#########################
  # HDL定位节点
  - id: hdl_localization
    path: ../build/modules/localization/hdl_localization_dora/hdl_localization_dora_node
    inputs:
      pointcloud: rslidar_driver/pointcloud
      imu: rslidar_driver/imu
    outputs:
      - pose
#######################################################

  # 目标点发布节点（任务调度）
  - id: goal_publisher
    path: ../build/modules/interface/goal_publisher/goal_publisher_node
    inputs:
      timer: dora/timer/millis/100
    outputs:
      - goal

#######################全局规划器#######################
  # A* 全局路径规划节点
  - id: astar_planner
    path: ../build/modules/planner/global_planner/astar_planner_dora/astar_planner_dora_node
    inputs:
      pose: hdl_localization/pose
      goal: goal_publisher/goal
    outputs:
      - path
#######################################################

#######################局部规划器#######################
  # Pure Pursuit 局部路径跟踪节点
  - id: pure_pursuit
    path: ../build/modules/planner/local_planner/pure_pursuit_dora/pure_pursuit_dora_node
    inputs:
      timer: dora/timer/millis/50
      goal: goal_publisher/goal
      path: astar_planner/path
      pose: hdl_localization/pose
      Odometry: ranger_miniv3_node/Odometry
      # Odometry: mickrobotx4/Odometry
    outputs:
      - cmd_vel

  # DWA 局部路径规划节点（路径跟踪 + 动态避障）
  # - id: dwa_planner
  #   path: ../build/modules/planner/local_planner/dwa_planner_dora/dwa_planner_dora_node
  #   inputs:
  #     timer: dora/timer/millis/50
  #     path: astar_planner/path
  #     pose: hdl_localization/pose
  #     pointcloud: rslidar_driver/pointcloud
  #     Odometry: mickrobotx4/Odometry
  #   outputs:
  #     - cmd_vel
  #     - dwa_trajectories
#######################################################

#######################底盘节点#########################
  # MickrRobotX4底盘节点
  # - id: mickrobotx4
  #   path: ../build/modules/chassis/dora_mickrobot/mickrobotx4
  #   inputs:
  #     timer: dora/timer/millis/10
  #     # cmd_vel: pure_pursuit/cmd_vel
  #     cmd_vel: dwa_planner/cmd_vel
  #   outputs:
  #     - Odometry

  # Ranger MiniV3底盘节点
  - id: ranger_miniv3_node
    path: ../build/modules/chassis/ranger_dora_node/ranger_miniv3_node
    inputs:
      timer: dora/timer/millis/10
      cmd_vel: pure_pursuit/cmd_vel
      # cmd_vel: dwa_planner/cmd_vel
    outputs:
      - Odometry
#######################################################

  # Rerun可视化节点
  - id: rerun_visualizer
    path: ../build/modules/visualization/rerun_visualizer/rerun_visualizer
    inputs:
      pointcloud: rslidar_driver/pointcloud
      pose: hdl_localization/pose
      path: astar_planner/path
      # dwa_trajectories: dwa_planner/dwa_trajectories